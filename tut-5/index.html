<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tut-5</title>
  </head>
  <body>
    <div style="display: flex; justify-content: center; height: 90vh; align-items: center; flex-direction: column; margin-bottom: 500px;">
      <div id="app"></div>
      <div id="tag"></div>
      <button style="background-color: rgb(71, 17, 180); font-size: 20px; padding: 15px; border-radius: 7px; color: white; margin-top: 20px;" id="btn">Repeat</button>
    </div>
    <div class="fab-container">
      <button class="fab-child">🍕</button>
      <button class="fab-child">🍔</button>
      <button class="fab-child">🍣</button>
      <button class="fab" style="visibility: hidden;">+</button>
    </div>
    <div class="cards">
      <div class="card" style="background: linear-gradient(135deg, rgba(8, 212, 248, 0.849), #011453);">Card 1</div>
      <div class="card" style="background: linear-gradient(135deg, rgb(164, 224, 108), #f01b1b);">Card 2</div>
      <div class="card" style="background: linear-gradient(135deg, rgba(197, 39, 197, 0.993), #545454);">Card 3</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
